name: Desktop React UI check

on:
  push:
    branches:
      - fix/node-card-keyboard-accessibility
  workflow_dispatch:

jobs:
  check-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/crates/wifi-densepose-desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/crates/wifi-densepose-desktop/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
