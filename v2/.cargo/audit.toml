    # Unmaintained (author-confirmed).  No CVE.  Build-time proc-macro;
    # zero runtime exposure.  Same family and same mitigation path as
    # RUSTSEC-2024-0370 above.
    "RUSTSEC-2026-0173",   # proc-macro-error2: unmaintained

    # -----------------------------------------------------------------------
    # rand <0.9 — RUSTSEC-2026-0097
    # Unsound: the rand 0.8 BlockRng64 implementation can panic and expose
    # uninitialized memory under certain reseeding sequences.  No CVE.
    # This workspace uses rand 0.8 only through ndarray-linalg and candle
    # for signal-processing RNG; it does not rely on BlockRng64 directly.
    # Mitigation: migrate to rand 0.9 once ndarray-linalg 0.19+ is released
    # (blocked on openblas-static update, tracked in #810).
    "RUSTSEC-2026-0097",   # rand <0.9: unsound

    # -----------------------------------------------------------------------
    # rkyv 0.8.x — RUSTSEC-2026-0122
    # Unsound: potential use-after-free in InlineVec/SerVec clear paths.
    # No CVE.  Pulled in by ruvector-core for zero-copy serialisation of
    # vector index snapshots.  The affected code path requires a panic
    # inside clear() which only occurs in out-of-memory conditions; the
    # application handles OOM at a higher level.
    # Mitigation: track rkyv 0.8.16+ fix once released (issue #811).
    "RUSTSEC-2026-0122",   # rkyv 0.8.x: unsound

    # -----------------------------------------------------------------------
    # rustls-pemfile — RUSTSEC-2025-0134
    # Unmaintained.  No CVE.  Pulled in by reqwest 0.11 (via ruvector-core
    # 2.2.0).  The workspace's own TLS code uses rustls-pemfile 2.x;
    # the 1.x instance is an artefact of the ruvector-core transitive dep.
    # Mitigation: resolve when ruvector-core upgrades to reqwest 0.12+.
    "RUSTSEC-2025-0134",   # rustls-pemfile 1.x: unmaintained

    # -----------------------------------------------------------------------
    # unic-* family — RUSTSEC-2025-0075, -0080, -0081, -0098, -0100
    # Unmaintained (superseded by icu4x).  No CVE.  Used by napi-derive at
    # build time for Unicode identifier handling.  Build-time only; no
    # runtime attack surface.
    "RUSTSEC-2025-0075",   # unic-char-range
    "RUSTSEC-2025-0080",   # unic-common
    "RUSTSEC-2025-0081",   # unic-char-property
    "RUSTSEC-2025-0098",   # unic-ucd-version
    "RUSTSEC-2025-0100",   # unic-ucd-ident

    # -----------------------------------------------------------------------
    # zip 0.6.x / 6.x / 7.x — RUSTSEC-2026-0367, RUSTSEC-2026-0368,
    # RUSTSEC-2026-0369
    # Three privilege-escalation advisories, all confined to the zip crate's
    # EXTRACTION path:
    #   0367 — SUID/SGID/sticky bits carried in `external_attributes` survive
    #          extraction instead of being masked to safe permission bits.
    #   0368 — `ZipArchive::extract` creates a symlink whose target bytes are
    #          handed to the platform symlink API without confining the
    #          target to the destination directory.
    #   0369 — `ZipStreamReader::extract` / `ZipArchive::extract` apply Unix
    #          permissions THROUGH an extracted symlink without validating
    #          that the symlink target stays inside the destination.
    # All three are fixed only in zip >= 9.0.0.
    #
    # NOT REACHABLE from this workspace: the vulnerable API is
    # `ZipArchive::extract` / `ZipStreamReader::extract`, and no crate in
    # the resolved graph calls either one.
    #   - ndarray-npy 0.10.0 (src/npz.rs) uses ZipArchive::new + by_name /
    #     by_index for reading and ZipWriter for writing.
    #   - candle-core 0.4.1 (src/npy.rs, src/pickle.rs) and 0.9.2
    #     (src/py.rs, src/pickle.rs) use the same read/write subset.
    #   - torch-sys 0.24.0 (build.rs) extracts the libtorch archive with its
    #     own per-entry loop — archive.by_index(i), fs::File::create and
    #     io::copy — so it never calls extract(), never creates a symlink
    #     (directory entries are skipped) and never applies the archive's
    #     Unix permission bits (files are created with umask defaults).
    # The single archive it does extract is the pinned libtorch build
    # downloaded over HTTPS from download.pytorch.org.
    #
    # Mitigation: a version bump is not possible yet — no published release
    # of the parents moves to zip >= 9.0.0 (ndarray-npy 0.10.0 -> zip ^6,
    # candle-core 0.11.0 -> zip ^8.6, tch/torch-sys 0.26.0 -> zip ^0.6).
    # Re-evaluate when candle-core / ndarray-npy / tch ship a release that
    # adopts zip 9.x, then delete this block and bump the lockfile.
    "RUSTSEC-2026-0367",   # zip: SUID/SGID preserved during extraction
    "RUSTSEC-2026-0368",   # zip: extract() symlink target escapes destination
    "RUSTSEC-2026-0369",   # zip: extract() applies permissions through symlinks
]
