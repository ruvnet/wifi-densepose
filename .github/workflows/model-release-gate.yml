name: Model release gate (ADR-298)

# ADR-298 model-release sanity gates (issue #1521): structural checks that
# block a degenerate/mislabeled classifier head (unreachable decision
# boundary, near-constant output, degenerate class balance, a metric
# surfaced under a task name it wasn't computed as) before it ships.
#
# Checker: v2/crates/wifi-densepose-train/src/model_gates.rs
# Entry point: v2/crates/wifi-densepose-train/src/bin/model_release_gate.rs
# Artifact reader: v2/crates/wifi-densepose-train/src/model_artifact.rs
#
# IMPORTANT — the honest scope of this job: it runs the release gate against
# real `.safetensors` artifacts that live in this repository, and it proves
# the gate rejects the degenerate head of issue #1521 (bias 8.19 against
# ‖w‖ 3.67). This repository does not automate uploading to the HuggingFace
# model repo (`ruvnet/wifi-densepose-pretrained`); that upload remains a
# manual, human-run step — but `scripts/publish-huggingface.py` now runs this
# same gate against the artifact before it uploads anything, and refuses to
# publish when the gate does not pass.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "v2/crates/wifi-densepose-train/**"
      - "v2/crates/cog-person-count/cog/artifacts/**"
      - "v2/crates/cog-pose-estimation/cog/artifacts/**"
      - "v2/crates/cog-pose-estimation/tests/fixtures/**"
      - "scripts/publish-huggingface.py"
      - "scripts/tests/test_publish_huggingface_gate.py"
      - ".github/workflows/model-release-gate.yml"
  pull_request:
    paths:
      - "v2/crates/wifi-densepose-train/**"
      - "v2/crates/cog-person-count/cog/artifacts/**"
      - "v2/crates/cog-pose-estimation/cog/artifacts/**"
      - "v2/crates/cog-pose-estimation/tests/fixtures/**"
      - "scripts/publish-huggingface.py"
      - "scripts/tests/test_publish_huggingface_gate.py"
      - ".github/workflows/model-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-release-gate:
    name: Model release gate check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Run the model-release gate's own test suite
        working-directory: v2
        run: cargo test -p wifi-densepose-train --no-default-features --lib -- --nocapture

      - name: Run the release-gate CLI end-to-end tests
        working-directory: v2
        run: cargo test -p wifi-densepose-train --no-default-features --test test_model_release_gate -- --nocapture

      - name: Check every in-tree .safetensors artifact against the format spec
        working-directory: v2
        run: |
          set -euo pipefail
          for artifact in \
            crates/cog-person-count/cog/artifacts/count_v1.safetensors \
            crates/cog-pose-estimation/cog/artifacts/pose_v1.safetensors \
            crates/cog-pose-estimation/tests/fixtures/sample_room.adapter.safetensors
          do
            echo "::group::$artifact"
            cargo run --quiet -p wifi-densepose-train --no-default-features \
              --bin model_release_gate -- --artifact "$artifact" --format-only
            echo "::endgroup::"
          done

      - name: Run the publish-path gate tests
        run: python -m unittest scripts/tests/test_publish_huggingface_gate.py

      - name: Summarize result
        if: always()
        run: |
          {
            echo '### Model release gate (ADR-298)'
            echo ''
            echo 'This job runs the ADR-298 release gate against real `.safetensors` artifacts'
            echo 'in this repository and proves the gate rejects the degenerate head of'
            echo 'issue #1521. It does not upload anything: the HuggingFace publish stays a'
            echo 'manual step, and `scripts/publish-huggingface.py` runs this same gate'
            echo 'before it uploads.'
          } >> "$GITHUB_STEP_SUMMARY"
