[package]
name = "wifi-densepose-physics-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
wifi-densepose-core = { path = "../../wifi-densepose-core", features = ["serde"] }
wifi-densepose-physics = { path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "pose_frame"
path = "fuzz_targets/pose_frame.rs"
test = false
doc = false
bench = false
