name: Update vendor submodules

# One pull request per submodule, each carrying a receipt: the old and the
# new commit, the comparison link, whether the target is reachable from the
# configured tracked branch, and the upstream's own verdict on that exact
# commit. A bundled multi-submodule branch-tip sweep cannot be attributed
# and carries no upstream evidence, which is what RuView#1743 reports.

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Restrict the run to one submodule path (default: every tracked submodule)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Identity must be set BEFORE any operation that can create a commit.
      # `git submodule update --remote --merge` used to fail here with
      # "Committer identity unknown" because the merge inside vendor/ruvector
      # needs an author when the pinned commit isn't a fast-forward of upstream.
      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Report the tracked submodule set
        run: python3 scripts/submodule_bump.py --list-tracked

      # The script resolves each tracked submodule's branch tip, checks that
      # the tip is reachable from that branch, reads the upstream's check runs
      # and combined status for that exact commit, and opens one pull request
      # per submodule that moved. A submodule whose target is not reachable,
      # or whose upstream has no clean verdict, is reported and left alone.
      - name: Open one pull request per submodule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMODULE: ${{ inputs.submodule }}
          RUN_TIMESTAMP: ${{ github.run_id }}
        run: python3 scripts/submodule_bump.py --apply
