name: nvsim-server → ghcr.io

# Builds and publishes the nvsim-server Docker image under the repository
# owner (ghcr.io/<owner>/nvsim-server) on:
# - push to main affecting nvsim-server or nvsim
# - tag push matching nvsim-server-v*
# - manual workflow_dispatch
#
# ADR-092 §6.2 + §9.4.

on:
  push:
    branches: [main]
    paths:
      - 'v2/crates/nvsim-server/**'
      - 'v2/crates/nvsim/**'
      - '.github/workflows/nvsim-server-docker.yml'
    tags: ['nvsim-server-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # ghcr.io is always the target; there is no Docker Hub leg here.
      # The image path is derived from the repository owner because a fork
      # cannot push to the upstream's `ruvnet` namespace — that push
      # fails with `denied: The requested installation does not exist`.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository_owner }}/nvsim-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: v2
          file: v2/crates/nvsim-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke-test the image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nvsim-server
        run: |
          # `type=sha,format=short` is emitted on every event, so this is
          # the one tag that always exists after a successful push. The
          # old `|| latest` fallback hid a failed push and only worked on
          # the default branch, so tag builds never reached this step.
          docker pull "${IMAGE}:sha-${GITHUB_SHA::7}"
          docker run --rm -d --name nvsim-test -p 7878:7878 \
            "${IMAGE}:sha-${GITHUB_SHA::7}"
          sleep 4
          curl -fsS http://localhost:7878/api/health
          docker stop nvsim-test
