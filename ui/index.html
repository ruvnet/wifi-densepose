<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f12" />
  <meta name="description" content="RuView — WiFi CSI presence, vital-sign and pose sensing operator console" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>RuView — Sensing Console</title>
  <link rel="stylesheet" href="assets/app.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body class="min-h-screen">
  <a href="#dashboard" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:m-3 btn-primary">Skip to content</a>

  <div id="app" class="md:flex md:min-h-screen">
    <!-- Sidebar (desktop) — rendered by main.js -->
    <aside id="sidebar"
           class="hidden md:flex md:flex-col md:w-60 md:shrink-0 md:fixed md:inset-y-0
                  border-r border-ink-3 bg-ink-1 z-30"></aside>

    <!-- Main column -->
    <div class="flex-1 md:ml-60 flex flex-col min-w-0">
      <!-- Top header — rendered by main.js -->
      <header id="topbar"
              class="sticky top-0 z-20 flex items-center gap-3 h-14 px-4
                     border-b border-ink-3 bg-ink-1/90 backdrop-blur"></header>

      <!-- Routed view -->
      <main id="view" class="flex-1 px-4 py-5 sm:px-6 max-w-6xl w-full mx-auto pb-24 md:pb-8"
            role="main" aria-live="polite"></main>
    </div>

    <!-- Bottom tab bar (mobile) — rendered by main.js -->
    <nav id="tabbar"
         class="md:hidden fixed bottom-0 inset-x-0 z-30 flex items-stretch
                border-t border-ink-3 bg-ink-1/95 backdrop-blur"
         style="padding-bottom: env(safe-area-inset-bottom)"
         aria-label="Primary"></nav>
  </div>

  <div id="toast-root" class="fixed bottom-20 md:bottom-4 inset-x-0 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

  <script type="module" src="app/main.js"></script>
</body>
</html>
