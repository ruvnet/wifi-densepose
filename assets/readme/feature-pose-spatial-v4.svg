<svg xmlns="http://www.w3.org/2000/svg" width="580" height="276" viewBox="0 0 580 276" role="img" aria-labelledby="title desc"><title id="title">Pose research</title><desc id="desc">Train and compare body keypoints. Live accuracy differs from benchmarks. Conceptual animation; follow the linked source for capability limits.</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102749"/><stop offset=".55" stop-color="#071429"/><stop offset="1" stop-color="#03091a"/></linearGradient><linearGradient id="accent"><stop stop-color="#9ee7ff"/><stop offset="1" stop-color="#348bff"/></linearGradient><radialGradient id="halo"><stop stop-color="#348bff" stop-opacity=".17"/><stop offset="1" stop-color="#348bff" stop-opacity="0"/></radialGradient></defs><style>
text{font-family:"Avenir Next","Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;letter-spacing:1.6px}
.float{animation:float 5s ease-in-out infinite}
.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}






@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-10px)}}



.limb{animation:limb 3s ease-in-out infinite;transform-origin:0 -18px}
.stride{animation:limb 3s ease-in-out infinite reverse;transform-origin:5px 16px}



@keyframes limb{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}




@keyframes flow{to{stroke-dashoffset:-136}}



@media(prefers-reduced-motion:reduce){*{animation:none!important}}
