<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">RuView quick start: four stages from a simulated preview to a live room</title><desc id="desc">Four stage beginner path: preview with Docker, sense with an ESP32 node, calibrate the empty room, automate the result. Commands and links, not measurements.</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102749"/><stop offset=".55" stop-color="#071429"/><stop offset="1" stop-color="#03091a"/></linearGradient><linearGradient id="accent"><stop stop-color="#9ee7ff"/><stop offset="1" stop-color="#348bff"/></linearGradient><radialGradient id="halo"><stop stop-color="#348bff" stop-opacity=".17"/><stop offset="1" stop-color="#348bff" stop-opacity="0"/></radialGradient></defs><style>
text{font-family:"Avenir Next","Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;letter-spacing:1.6px}
.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}




@keyframes flow{to{stroke-dashoffset:-136}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="1199" height="339" rx="18" fill="url(#wash)" stroke="#2d4e77"/><text x="36" y="42" font-size="12" fill="#78cfff" text-anchor="start" font-weight="500" class="mono">QUICK START / FOUR STAGES</text><text x="36" y="84" font-size="32" fill="#f3f7ff" text-anchor="start" font-weight="650" letter-spacing="-0.6" >From a simulated preview to a live room.</text><rect x="36" y="112" width="270" height="176" rx="14" fill="#091b35" stroke="#315685"/><text x="56" y="146" font-size="12" fill="#78cfff" text-anchor="start" font-weight="500" >01</text><text x="56" y="182" font-size="24" fill="#f3f7ff" text-anchor="start" font-weight="500" >Preview</text><text x="56" y="210" font-size="14" fill="#b0c2db" text-anchor="start" font-weight="500" >Docker, no hardware</text><text x="56" y="266" font-size="12" fill="#b0c2db" text-anchor="start" font-weight="500" class="mono">docker pull</text><path d="M308 200H326M318 192L326 200L318 208" fill="none" stroke="#78cfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="330" y="112" width="270" height="176" rx="14" fill="#091b35" stroke="#315685"/><text x="350" y="146" font-size="12" fill="#78cfff" text-anchor="start" font-weight="500" >02</text><text x="350" y="182" font-size="24" fill="#f3f7ff" text-anchor="start" font-weight="500" >Sense</text><text x="350" y="210" font-size="14" fill="#b0c2db" text-anchor="start" font-weight="500" >Flash and provision a node</text><text x="350" y="266" font-size="12" fill="#b0c2db" text-anchor="start" font-weight="500" class="mono">provision.py</text><path d="M602 200H620M612 192L620 200L612 208" fill="none" stroke="#78cfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="624" y="112" width="270" height="176" rx="14" fill="#091b35" stroke="#315685"/><text x="644" y="146" font-size="12" fill="#78cfff" text-anchor="start" font-weight="500" >03</text><text x="644" y="182" font-size="24" fill="#f3f7ff" text-anchor="start" font-weight="500" >Calibrate</text><text x="644" y="210" font-size="14" fill="#b0c2db" text-anchor="start" font-weight="500" >Record the empty room</text><text x="644" y="266" font-size="12" fill="#b0c2db" text-anchor="start" font-weight="500" class="mono">calibration/start</text><path d="M896 200H914M906 192L914 200L906 208" fill="none" stroke="#78cfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="918" y="112" width="270" height="176" rx="14" fill="#091b35" stroke="#315685"/><text x="938" y="146" font-size="12" fill="#78cfff" text-anchor="start" font-weight="500" >04</text><text x="938" y="182" font-size="24" fill="#f3f7ff" text-anchor="start" font-weight="500" >Automate</text><text x="938" y="210" font-size="14" fill="#b0c2db" text-anchor="start" font-weight="500" >Home Assistant, MQTT, agents</text><text x="938" y="266" font-size="12" fill="#b0c2db" text-anchor="start" font-weight="500" class="mono">home-assistant.md</text><text x="36" y="318" font-size="10" fill="#b0c2db" text-anchor="start" font-weight="500" class="mono">FOLLOW IN ORDER OR JUMP IN. EXACT COMMANDS BELVE.</text><path d="M24 1H1176" stroke="url(#accent)" opacity=".55"/><path d="M24 339H1176" stroke="#438fff" opacity=".15"/></svg>
