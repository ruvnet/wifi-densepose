name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.4.0)'
        required: true
        default: '0.4.4'
      attach_to_existing:
        description: 'Attach to existing release tag (leave empty to create new)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Build natively on each runner. This avoids cross-compilation
          # failures from native dependencies used by the desktop crate.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: v2/crates/wifi-densepose-desktop/ui
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: v2/crates/wifi-densepose-desktop/ui
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri app
        working-directory: v2/crates/wifi-densepose-desktop
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Package macOS app
        run: |
          cd v2/target/${{ matrix.target }}/release/bundle/macos
          zip -r "RuView-Desktop-${{ github.event.inputs.version || '0.4.4' }}-macos-${{ matrix.arch }}.zip" "RuView Desktop.app"
          if [ "${{ matrix.arch }}" = "x64" ]; then
            cp "RuView-Desktop-${{ github.event.inputs.version || '0.4.4' }}-macos-x64.zip" "RuView-Desktop-${{ github.event.inputs.version || '0.4.4' }}-macos15-intel.zip"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruview-macos-${{ matrix.arch }}
          path: v2/target/${{ matrix.target }}/release/bundle/macos/*.zip

  build-macos-universal:
    name: Build macOS universal
    needs: build-macos
    runs-on: macos-15-intel
    steps:
      - name: Download Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: ruview-macos-x64
          path: artifacts/x64

      - name: Download Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: ruview-macos-arm64
          path: artifacts/arm64

      - name: Create universal app and DMG
        run: |
          set -euo pipefail
          mkdir -p extracted/x64 extracted/arm64
          unzip -q "artifacts/x64/*macos-x64.zip" -d extracted/x64
          unzip -q "artifacts/arm64/*macos-arm64.zip" -d extracted/arm64

          rm -rf "RuView Desktop.app"
          cp -R "extracted/arm64/RuView Desktop.app" "RuView Desktop.app"
          lipo -create \
            "extracted/x64/RuView Desktop.app/Contents/MacOS/wifi-densepose-desktop" \
            "extracted/arm64/RuView Desktop.app/Contents/MacOS/wifi-densepose-desktop" \
            -output "RuView Desktop.app/Contents/MacOS/wifi-densepose-desktop"

          codesign --force --deep --sign - "RuView Desktop.app"
          ditto -c -k --keepParent "RuView Desktop.app" \
            "RuView-Desktop-${{ github.event.inputs.version || '0.4.4' }}-macos-universal.zip"
          hdiutil create -volname "RuView Desktop" \
            -srcfolder "RuView Desktop.app" \
            -ov -format UDZO \
            "RuView-Desktop-${{ github.event.inputs.version || '0.4.4' }}-macos-universal.dmg"

      - name: Verify universal binary
        run: |
          file "RuView Desktop.app/Contents/MacOS/wifi-densepose-desktop"
          lipo -info "RuView Desktop.app/Contents/MacOS/wifi-densepose-desktop"

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ruview-macos-universal
          path: |
            RuView-Desktop-*-macos-universal.zip
            RuView-Desktop-*-macos-universal.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install frontend dependencies
        working-directory: v2/crates/wifi-densepose-desktop/ui
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: v2/crates/wifi-densepose-desktop/ui
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri app
        working-directory: v2/crates/wifi-densepose-desktop
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruview-windows-msi
          path: v2/target/release/bundle/msi/*.msi

      - name: Upload Windows NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruview-windows-nsis
          path: v2/target/release/bundle/nsis/*.exe

  create-release:
    name: Create Release
    needs: [build-macos, build-macos-universal, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          name: RuView Desktop v${{ github.event.inputs.version || '0.4.4' }}
          tag_name: ${{ github.event.inputs.attach_to_existing || format('desktop-v{0}', github.event.inputs.version || '0.4.4') }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ github.event.inputs.attach_to_existing == '' }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
          body: |
            ## RuView Desktop v${{ github.event.inputs.version || '0.4.4' }}

            WiFi-based human pose estimation desktop application.

            ### Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | macOS | Apple Silicon (M1/M2/M3) | `RuView-Desktop-*-macos-arm64.zip` |
            | macOS | Intel (macOS 15) | `RuView-Desktop-*-macos-x64.zip` (`*-macos15-intel.zip`) |
            | macOS | Universal | `RuView-Desktop-*-macos-universal.zip` or `.dmg` |
            | Windows | x64 | `RuView-Desktop-*.msi` or `RuView-Desktop-*.exe` |

            ### Installation

            **macOS:**
            1. Download the appropriate `.zip` or `.dmg` file for your Mac
            2. Extract or open the file
            3. Move `RuView Desktop.app` to your Applications folder
            4. Right-click and select "Open" (first time only, to bypass Gatekeeper)

            **Windows:**
            1. Download the `.msi` installer
            2. Run the installer
            3. Launch RuView Desktop from the Start menu

            ### Requirements
            - macOS 11.0+ (Big Sur or later; supports macOS 15 Sequoia Intel & Apple Silicon)
            - Windows 10/11 (64-bit)
