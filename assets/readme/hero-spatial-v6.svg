" fill="none" stroke="#78cfff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="flow" style="animation-delay:-1s"/><path d="M795 325Q854 273 939 257" fill="none" stroke="#78cfff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="flow" style="animation-delay:-2s"/><circle cx="780" cy="153" r="3" stroke="#ffb45e"  fill="#ffb45e" class="spark"/><circle cx="963" cy="70" r="3" stroke="#ffb45e"  fill="#ffb45e" class="spark"/><circle cx="1148" cy="162" r="3" stroke="#ffb45e"  fill="#ffb45e" class="spark"/><circle cx="1148" cy="303" r="3" stroke="#ffb45e"  fill="#ffb45e" class="spark"/><circle cx="960" cy="400" r="3" stroke="#ffb45e"  fill="#ffb45e" class="spark"/><text x="1148" y="419" font-size="10" fill="#b0c2db" text-anchor="end" font-weight="500" class="mono">CONCEPTUAL RF FIELD</text><path d="M24 1H1176" stroke="url(#accent)" opacity=".55"/><path d="M24 449H1176" stroke="#438fff" opacity=".15"/></svg>
