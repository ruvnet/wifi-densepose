version: '3.8'

# SECURITY NOTE (fixes ruvnet/RuView issue #864):
# The original compose file bound the sensing server to 0.0.0.0 and published
# 3000/3001/5005-udp by default, with RUVIEW_API_TOKEN empty. That meant:
#   - /api/v1/* bearer auth silently became a no-op when the token was unset
#   - /ws/sensing (the live sensing WebSocket) was unauthenticated even when
#     a token WAS set
# On any shared/guest network, VPN, or accidentally-forwarded host, that
# exposed live pose/vitals data to anyone who could reach the port.
#
# Fixes applied here:
#   1. RUVIEW_API_TOKEN is now REQUIRED (no default) - compose will refuse
#      to start without one.
#   2. Ports are bound to 127.0.0.1 by default instead of all interfaces.
#      Set RUVIEW_LAN_MODE=1 explicitly (and understand the risk) to expose
#      beyond localhost - see the ${RUVIEW_BIND_ADDR} override below.
#   3. Added resource limits and a read-only root filesystem, per the
#      separate hardening audit (missing mem/cpu/pids limits, no read_only).

x-common-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 2G
      reservations:
        cpus: '0.5'
        memory: 512M

services:
  sensing-server:
    image: ${RUVIEW_IMAGE:-ghcr.io/ruvnet/ruview:latest}
    container_name: ruview-sensing-server
    <<: *hardening
    environment:
      # Required. Compose fails fast (see healthcheck) if left unset.
      - RUVIEW_API_TOKEN=${RUVIEW_API_TOKEN:?RUVIEW_API_TOKEN must be set - refusing to start with auth disabled}
      - CSI_SOURCE=${CSI_SOURCE:-simulated}
      - RUVIEW_BIND_ADDR=${RUVIEW_BIND_ADDR:-127.0.0.1}
    ports:
      # Bind to loopback by default. Only widen this (e.g. 0.0.0.0:3000:3000)
      # if you understand the exposure and have RUVIEW_API_TOKEN set AND
      # WebSocket auth confirmed patched in the version you're running.
      - "${RUVIEW_BIND_ADDR:-127.0.0.1}:3000:3000"
      - "${RUVIEW_BIND_ADDR:-127.0.0.1}:3001:3001"
      - "${RUVIEW_BIND_ADDR:-127.0.0.1}:5005:5005/udp"
    networks:
      - ruview-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Authorization: Bearer ${RUVIEW_API_TOKEN}", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  ruview-internal:
    driver: bridge
    internal: false  # set true if you don't need the host reaching out further
